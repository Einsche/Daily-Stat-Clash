name: Test standalone game server
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/test-node.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check client syntax
        run: |
          node --check web/app.js
          node --check web/config.js
      - name: Test server with real SQLite and live HTTP requests
        run: npm test
      - name: Build production container and verify HTTP health
        shell: bash
        run: |
          set -euo pipefail
          docker build -t daily-stat-clash:ci .
          docker run -d --name daily-stat-clash-ci -p 127.0.0.1:35123:3000 daily-stat-clash:ci
          trap 'docker logs daily-stat-clash-ci || true; docker rm -f daily-stat-clash-ci || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:35123/Daily-Stat-Clash/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          echo "Container started successfully."
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:35123/Daily-Stat-Clash/
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:35123/Daily-Stat-Clash/guest-roster.json
