name: Verify username-password backend in PostgreSQL
on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - 'supabase/seed.sql'
      - '.github/workflows/check-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stat_clash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stat_clash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Load schema and seed (real PostgreSQL 17)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/app:ro" \
            -e PGPASSWORD=testpassword postgres:17 \
            psql -h 127.0.0.1 -U postgres -d stat_clash -v ON_ERROR_STOP=1 \
            -f /app/supabase/schema.sql -f /app/supabase/seed.sql
      - name: End-to-end registration, login, draw and submission
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host -e PGPASSWORD=testpassword \
              postgres:17 psql -q -t -A -h 127.0.0.1 -U postgres \
              -d stat_clash -v ON_ERROR_STOP=1 -c "$1"
          }
          count=$(pg "select count(*) from public.game_characters")
          test "$count" = 101
          password="ExampleStrongPassword12"
          token=$(pg "select public.game_register('TestPlayer01','$password')->>'token'")
          test "\${#token}" -eq 64
          test "$(pg "select public.game_register('testplayer01','AnotherStrongPassword12')->>'error'")" = 'This username is taken.'
          test "$(pg "select public.game_login('TestPlayer01','wrongpassword')->>'error'")" = 'Invalid username or password.'
          token2=$(pg "select public.game_login('testplayer01','$password')->>'token'")
          test "\${#token2}" -eq 64
          test "$(pg "select public.game_state('$token2')->'user'->>'handle'")" = 'TestPlayer01'
          for stat in strength dexterity battle_iq endurance hacks iq; do
            pg "select public.game_draw('$token2')->'current'->>'id'" >/dev/null
            pg "select jsonb_array_length(public.game_assign('$token2','$stat')->'picks')" >/dev/null
          done
          test "$(pg "select jsonb_array_length(public.game_state('$token2')->'picks')")" = 6
          test "$(pg "select public.game_submit('$token2')->>'submitted'")" = 'true'
          pg "select public.game_settle_day(public.game_today()-1)" >/dev/null
          test "$(pg "select public.game_state('$token2')->>'submitted'")" = 'true'
          test "$(pg "select public.game_logout('$token2')->>'ok'")" = 'true'
          test "$(pg "select public.game_state('$token2')->'user'")" = 'null'
          echo "PASS: 101 seed characters, unique usernames, bcrypt login, token sessions, six draws, submit and logout."
