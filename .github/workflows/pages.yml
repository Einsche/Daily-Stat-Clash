name: Publish independent Daily Stat Clash site
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/public/assets/portraits/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Assemble static site and original character portraits
        run: |
          set -euo pipefail
          mkdir -p web/app/public/assets
          cp -R app/public/assets/portraits web/app/public/assets/portraits
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/config.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
