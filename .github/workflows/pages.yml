name: Publish independent Daily Stat Clash site
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/src/data/characters.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify franchise guest roster and static files
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/app.js
          test -f web/guest-roster.json
          test -f web/styles.css
          node -e "const a=require('./web/guest-roster.json');if(a.length!==160)process.exit(1)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
