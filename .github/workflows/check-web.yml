name: Validate public guest-mode interface
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/src/data/characters.json'
      - '.github/workflows/check-web.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript and guest interface
        shell: bash
        run: |
          node --check web/app.js
          node --check web/matchup-engine.js
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('web/index.html','utf8');
          const js=fs.readFileSync('web/app.js','utf8');
          const roster=JSON.parse(fs.readFileSync('web/guest-roster.json','utf8'));
          const scores=JSON.parse(fs.readFileSync('web/guest-score-map.json','utf8'));
          const engine=require('./web/matchup-engine.js');
          const ids=new Set([...html.matchAll(/id="([^"]+)"/g)].map(m=>m[1]));
          const references=[...js.matchAll(/\$\('([^']+)'\)/g)].map(m=>m[1]);
          const created=new Set([...js.matchAll(/\.id\s*=\s*'([^']+)'/g)].map(m=>m[1]));
          const missing=[...new Set(references)].filter(id=>!ids.has(id)&&!created.has(id));
          assert.deepEqual(missing,[],'Missing DOM elements');
          assert.ok(ids.has('guest-start'),'Missing guest button');
          assert.ok(ids.has('guest-switcher'),'Missing three-slot guest switcher');
          assert.ok(ids.has('resolve-matches'),'Missing local matchup calculation button');
          assert.ok(html.includes('matchup-engine.js'),'Matchup engine script missing');
          assert.ok(!html.includes('auth-dialog'),'Login form must be removed');
          assert.ok(!html.includes('SIGN IN') && !html.includes('CREATE ACCOUNT'));
          assert.equal(roster.length,160,'Guest roster must contain 160 characters');
          assert.equal(Object.keys(scores.stats).length,160);
          assert.equal(scores.rosterVersion,'hxh-naruto-dc-marvel-witcher-jjk-aot-bleach-v2');
          assert.equal(new Set(roster.map(x=>x.id)).size,160);
          const full=JSON.parse(fs.readFileSync('app/src/data/characters.json','utf8'));
          assert.deepEqual(roster.map(x=>x.id),full.map(x=>x.id));
          const universes=[
            'Hunter x Hunter','Naruto','DC','Marvel','The Witcher',
            'Jujutsu Kaisen','Attack on Titan','Bleach'
          ];
          assert.equal(full.length,160);
          assert.deepEqual([...new Set(full.map(c=>c.universe))].sort(),universes.sort());
          for(const u of universes){
            assert.equal(roster.filter(c=>c.universe===u).length,20,u+' character count');
          }
          for(const c of roster){
            assert.deepEqual(Object.keys(c).sort(),['id','name','universe']);
            const fullCharacter=full.find(x=>x.id===c.id);
            assert.ok(fullCharacter,'Guest entry must have a full database entry');
            const score=scores.stats[c.id];
            assert.ok(score,'Guest scoring values missing for '+c.id);
            assert.equal(fullCharacter.portrait_url,null,'Franchise artwork is not licensed');
            for(const stat of ['strength','dexterity','battle_iq','endurance','hacks','iq']){
              assert.equal(score[stat],fullCharacter[stat]);
              assert.ok(Number.isInteger(fullCharacter[stat]) &&
                fullCharacter[stat]>=0 && fullCharacter[stat]<=100,
                'Missing valid '+stat+' for '+c.id);
            }
          }
          assert.ok(js.includes('CREATE GUEST '));
          assert.ok(js.includes('localStorage') && js.includes('nowDay'));
          assert.equal(engine.STATS.length,6);
          console.log('PASS: independent 3-guest interface, 160 scores, matchup engine and 8 universes');
          NODE
